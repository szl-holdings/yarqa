# SPDX-License-Identifier: Apache-2.0
# One candidate-only object materialization, using independently checked resolver bytes.
# No commit, ref, default branch, publisher, model or runtime write is performed.
name: Materialize reviewed Yarqa lock objects
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_reconcile_python_locks_once.yml
permissions:
  contents: read
concurrency:
  group: yarqa-reviewed-lock-objects-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  objects:
    if: github.repository == 'szl-holdings/yarqa' && github.event.pull_request.number == 65 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Materialize exactly two verified Git objects without moving a ref
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          """Materialize two already-reviewed lock blobs; never update a commit or ref."""
          from __future__ import annotations
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          REPO = "szl-holdings/yarqa"
          SOURCE = "e35cc233ab77b88b33336b4f3dd65087b5216c70"
          ARTIFACT_SHA256 = "ebc705c05d66918e19f6e3ba6eea4f859ce4f2499b4cd54ee66256ef178fb386"
          OLD = ("uvicorn[standard]==0.52.4 \\\n"
                 "    --hash=sha256:73acfee47a0b133c5de13d219492d62d8a31e935f4fe6e41a232451a15379f86 \\\n"
                 "    --hash=sha256:f86e41a149d7d05a9969337e3946a9c171c06a5d42680896daaba624aeac8da1")
          NEW = ("uvicorn[standard]==0.53.0 \\\n"
                 "    --hash=sha256:a9356f0cb89b3b8621529c5d5eebd69bfe154f4c3f68b4cf2de47e45fa855c2e \\\n"
                 "    --hash=sha256:e8dca71ec86dce5f04e333f0d56cdedf942446e6643b9cea1af0d6d3a02cb03e")
          SPECS = {
              "space/requirements.lock": {
                  "old_git": "6d90ee1184864a81370e63b1f9a1fcab6d478de8",
                  "old_sha256": "d752e4cad878af8a0aa02dae0832ef7b40a0f9b610a13aa35ac5ad18f65371e1",
                  "new_sha256": "31b749b7fa78035a20dc20b2988e964c9c9d1e5e6fce883ee87416f76f664672",
              },
              ".github/requirements/space-ci.lock": {
                  "old_git": "c56da7f9aa1776aa525bb00807678037a4431b9d",
                  "old_sha256": "1213f1cd52d77e1de151d35fd17fa5c94b701747e7d4bb14926b54e08e5786db",
                  "new_sha256": "98c358d31fc6e450cb8d045b8874906cea010e74b0e266d056847996e5a1811b",
              },
          }

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()

          def reviewed_candidate(data: bytes, spec: dict[str, str]) -> bytes:
              if len(data) > 100_000 or git_blob_sha(data) != spec["old_git"]:
                  raise ValueError("input Git blob mismatch")
              if hashlib.sha256(data).hexdigest() != spec["old_sha256"]:
                  raise ValueError("input SHA256 mismatch")
              text = data.decode("utf-8", errors="strict")
              if text.count(OLD) != 1:
                  raise ValueError("expected exact previous lock record once")
              result = text.replace(OLD, NEW, 1).encode("utf-8")
              if hashlib.sha256(result).hexdigest() != spec["new_sha256"]:
                  raise ValueError("candidate differs from verified resolver artifact")
              return result

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("unexpected GitHub API redirect")

          def main() -> None:
              token = os.environ["GH_TOKEN"]
              opener = urllib.request.build_opener(NoRedirect())
              def api(suffix: str, payload: dict | None = None) -> dict:
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{REPO}/{suffix}",
                      data=None if payload is None else json.dumps(payload).encode("utf-8"),
                      headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"},
                      method="GET" if payload is None else "POST",
                  )
                  with opener.open(request, timeout=30) as response:
                      data = response.read(2_000_001)
                  if len(data) > 2_000_000:
                      raise ValueError("oversized API response")
                  result = json.loads(data)
                  if not isinstance(result, dict):
                      raise ValueError("unexpected API response type")
                  return result
              pr = api("pulls/65")
              if pr.get("state") != "open" or pr.get("draft") is not True or pr["head"]["sha"] != os.environ["SOURCE_SHA"]:
                  raise ValueError("candidate moved or is no longer an open draft")
              output = {"schema": "szl.reviewed-lock-git-objects/v1", "resolver_source_sha": SOURCE, "resolver_artifact_id": 10727937220, "resolver_artifact_sha256": ARTIFACT_SHA256, "materializer_source_sha": os.environ["SOURCE_SHA"], "ref_updates": 0, "commit_creations": 0, "blobs": {}}
              prepared = {}
              for path, spec in SPECS.items():
                  blob = api(f"git/blobs/{spec['old_git']}")
                  if blob.get("sha") != spec["old_git"] or blob.get("encoding") != "base64":
                      raise ValueError("invalid source blob response")
                  data = base64.b64decode("".join(blob["content"].split()), validate=True)
                  if blob.get("size") != len(data):
                      raise ValueError("source blob size mismatch")
                  prepared[path] = reviewed_candidate(data, spec)
              # Only the two SHA-bound immutable objects are written. No refs/commits API.
              for path, data in prepared.items():
                  result = api("git/blobs", {"encoding": "base64", "content": base64.b64encode(data).decode("ascii")})
                  expected_git = git_blob_sha(data)
                  if result.get("sha") != expected_git:
                      raise ValueError("written Git object differs from candidate")
                  output["blobs"][path] = {"git_sha": expected_git, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
              target = Path("reviewed-lock-objects.json")
              target.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(output, indent=2))

          if __name__ == "__main__":
              main()
          PY
      - name: Retain source and object binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-yarqa-lock-objects-${{ github.event.pull_request.head.sha }}
          path: reviewed-lock-objects.json
          if-no-files-found: error
          retention-days: 7
