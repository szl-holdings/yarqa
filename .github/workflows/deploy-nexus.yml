name: Deploy NEXUS Space

# One-shot publisher: this repository already holds the governed HF write
# token. The canonical reusable always checkouts the CALLER, so NEXUS files
# cannot be published from szl-holdings/nexus until that repo is granted
# HF_ORG_TOKEN. This job checkouts szl-holdings/nexus, builds the Nitro
# node-server bundle, and runs the pinned publisher against space/Dockerfile.
#
# workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      nexus-ref:
        description: "szl-holdings/nexus ref to publish"
        required: true
        default: "main"
      recreate-space:
        description: "Delete and recreate SZLHOLDINGS/nexus before publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-nexus-space
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish NEXUS COPY set to SZLHOLDINGS/nexus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout NEXUS source of truth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/nexus
          ref: ${{ inputs.nexus-ref }}
          path: caller
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact reusable-workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: e3ec47ad2e99a535839afe0f30fefbd8973d52da
          path: tools
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact publisher tools revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TOOLS_SHA='e3ec47ad2e99a535839afe0f30fefbd8973d52da'
          ACTUAL_TOOLS_SHA="$(git -C tools rev-parse --verify HEAD)"
          if [ "$ACTUAL_TOOLS_SHA" != "$EXPECTED_TOOLS_SHA" ]; then
            echo "::error::Reusable-workflow tools mismatch: expected $EXPECTED_TOOLS_SHA, found $ACTUAL_TOOLS_SHA"
            exit 2
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build NEXUS node-server bundle
        working-directory: caller
        run: |
          set -euo pipefail
          npm ci
          NITRO_PRESET=node-server node scripts/with-app-env.mjs ./node_modules/.bin/vite build
          test -f .output/server/index.mjs
          rm -rf space-dist
          mv .output space-dist

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Create fresh publisher virtual environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/hf-publisher-venv"
          python3 -m venv "$VENV"
          ACTUAL_VERSION="$("$VENV/bin/python" -I -P -c 'import platform; print(platform.python_version())')"
          if [ "$ACTUAL_VERSION" != "3.12.10" ]; then
            echo "::error::Expected publisher Python 3.12.10, found $ACTUAL_VERSION."
            exit 2
          fi

      - name: Install hash-locked deployment client closure
        shell: bash
        run: >-
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P -m pip install
          --disable-pip-version-check --require-hashes --only-binary=:all:
          --ignore-installed -r tools/requirements/hf-publisher.lock

      - name: Require governed publisher
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo '::error::HF_TOKEN is not configured for the NEXUS publisher.'
            exit 2
          }

      - name: Recreate Space to clear corrupt factory cache
        if: ${{ inputs.recreate-space }}
        env:
          HF_REPO: SZLHOLDINGS/nexus
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P - <<'PY'
          import os
          import time
          from huggingface_hub import HfApi

          repo = os.environ["HF_REPO"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          try:
              api.delete_repo(repo_id=repo, repo_type="space")
              print(f"deleted {repo}")
          except Exception as exc:
              print(f"delete skipped: {type(exc).__name__}: {exc}")
          time.sleep(3)
          api.create_repo(
              repo_id=repo,
              repo_type="space",
              space_sdk="docker",
              space_hardware="cpu-basic",
              exist_ok=True,
          )
          print(f"created docker Space {repo} on cpu-basic")
          PY

      - name: Deploy Dockerfile-derived files to the Space
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: szl-holdings/nexus
          HF_REPO: SZLHOLDINGS/nexus
          DEPLOY_REF: ${{ inputs.nexus-ref }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C caller rev-parse HEAD)"
          echo "Deploying szl-holdings/nexus -> SZLHOLDINGS/nexus @ ${DEPLOY_REF} (${SOURCE_SHA})"
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P tools/.github/scripts/hf_deploy_from_dockerfile.py \
            --repo-root caller \
            --github-repo "$GH_REPO" \
            --hf-repo "$HF_REPO" \
            --ref "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --dockerfile-path space/Dockerfile \
            --include-readme true \
            --smoke-paths '["/"]' \
            --prune \
            --manifest-out hf-deploy-manifest.json

      - name: Attach cpu-basic and restart the Space
        env:
          HF_REPO: SZLHOLDINGS/nexus
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P - <<'PY'
          import json
          import os
          import time
          from huggingface_hub import HfApi

          repo = os.environ["HF_REPO"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          sha = json.load(open("hf-deploy-manifest.json"))["hf_commit_oid"]

          def snapshot():
              rt = api.get_space_runtime(repo_id=repo)
              return getattr(rt, "hardware", None), getattr(rt, "stage", None)

          try:
              api.request_space_hardware(repo_id=repo, hardware="cpu-basic")
              print("requested cpu-basic hardware")
          except Exception as exc:
              print(f"hardware request skipped: {type(exc).__name__}: {exc}")

          hardware, stage = snapshot()
          print(f"hardware={hardware!r} stage={stage!r}")
          # PAUSED/SLEEPING spaces report hardware=None until woken.
          # A normal restart resumes sleep. factory_reboot stays False —
          # reboot detaches cpu-basic and the factory then BUILD_ERRORs.
          if hardware is None and str(stage) in ("PAUSED", "STOPPED", "SLEEPING"):
              try:
                  asleep = str(stage)
                  runtime = api.restart_space(repo_id=repo, factory_reboot=False)
                  stage = getattr(runtime, "stage", stage)
                  print(f"woke {asleep} without factory-reboot; now {stage!r}")
              except Exception as exc:
                  print(f"wake skipped: {type(exc).__name__}: {exc}")

          deadline = time.time() + 420
          hardware, stage = snapshot()
          print(f"hardware={hardware!r} stage={stage!r}")
          while hardware is None and time.time() < deadline:
              time.sleep(10)
              try:
                  api.request_space_hardware(repo_id=repo, hardware="cpu-basic")
              except Exception as exc:
                  print(f"hardware request skipped: {type(exc).__name__}: {exc}")
              hardware, stage = snapshot()
              print(f"hardware={hardware!r} stage={stage!r}")

          if hardware is None:
              raise SystemExit(
                  "cpu-basic never attached. Refusing restart on a Space with no hardware."
              )

          # Do not factory-reboot: that detaches cpu-basic and the factory
          # then BUILD_ERRORs with git exit 128. A normal restart rebuilds
          # the already-published COPY set on attached hardware.
          runtime = api.restart_space(repo_id=repo, factory_reboot=False)
          stage = getattr(runtime, "stage", runtime)
          print(f"restart requested for {repo}@{sha}; hardware={hardware!r} stage={stage!r}")
          PY

      - name: Attest exact running commit, bytes, and smoke routes
        env:
          HF_REPO: SZLHOLDINGS/nexus
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P tools/.github/scripts/hf_deploy_from_dockerfile.py \
            --attest \
            --manifest hf-deploy-manifest.json \
            --hf-repo "$HF_REPO" \
            --wait-running 900

      - name: Dump Space factory logs on failure
        if: failure()
        env:
          HF_REPO: SZLHOLDINGS/nexus
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hf-publisher-venv/bin/python" -I -P - <<'PY'
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["HF_REPO"]
          token = os.environ["HF_TOKEN"]
          for path in (
              f"https://huggingface.co/api/spaces/{repo}",
              f"https://huggingface.co/api/spaces/{repo}/logs",
              f"https://huggingface.co/api/spaces/{repo}/logs/error",
          ):
              req = urllib.request.Request(
                  path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      body = resp.read()[:8000]
                      print(f"=== {path} HTTP {resp.status} ===")
                      print(body.decode("utf-8", "replace"))
              except urllib.error.HTTPError as exc:
                  print(f"=== {path} HTTP {exc.code} ===")
                  print(exc.read()[:2000].decode("utf-8", "replace"))
              except Exception as exc:
                  print(f"=== {path} {type(exc).__name__}: {exc} ===")
          PY

      - name: Upload immutable deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-deploy-nexus-evidence
          path: hf-deploy-manifest.json
          if-no-files-found: warn
          retention-days: 90
