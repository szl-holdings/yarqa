# SPDX-License-Identifier: Apache-2.0
# Read-only replacement for the retired branch-specific lock pusher.
# Produces review material only; never commits, publishes, or certifies a release.
name: Resolve Yarqa Python lock candidate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_reconcile_python_locks_once.yml
      - pyproject.toml
      - space/requirements.txt
      - space/requirements.lock
      - .github/requirements/space-ci.lock

permissions:
  contents: read

concurrency:
  group: yarqa-lock-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'szl-holdings/yarqa' && github.event.pull_request.number == 65 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out exact candidate without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up matching Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Capture exact inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, shutil
          root = Path("lock-candidate")
          (root / "before").mkdir(parents=True, exist_ok=True)
          inputs = ["pyproject.toml", "space/requirements.txt", "space/requirements.lock", ".github/requirements/space-ci.lock"]
          manifest = {"schema": "szl.python-lock-candidate/v1", "source_sha": os.environ["SOURCE_SHA"], "base_sha": os.environ["BASE_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "state": "INPUTS_CAPTURED", "compiler": "uv==0.8.22", "python_version": "3.11", "platform": "x86_64-manylinux2014", "requested_upgrade": "uvicorn==0.53.0", "inputs_sha256": {}}
          if not re.fullmatch(r"[0-9a-f]{40}", manifest["source_sha"]):
              raise SystemExit("invalid source identity")
          for name in inputs:
              manifest["inputs_sha256"][name] = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          shutil.copyfile("space/requirements.lock", root / "before/runtime.lock")
          shutil.copyfile(".github/requirements/space-ci.lock", root / "before/test.lock")
          (root / "resolution.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Generate hashed candidate with the existing compiler version
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .resolver-venv
          .resolver-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'uv==0.8.22'
          .resolver-venv/bin/uv --version > lock-candidate/compiler-version.txt
          .resolver-venv/bin/uv pip compile \
            --python-version 3.11 --python-platform x86_64-manylinux2014 \
            --generate-hashes --no-strip-extras \
            --output-file space/requirements.lock \
            --upgrade-package 'uvicorn==0.53.0' \
            pyproject.toml space/requirements.txt
          .resolver-venv/bin/uv pip compile \
            --extra test --python-version 3.11 --python-platform x86_64-manylinux2014 \
            --generate-hashes --no-strip-extras \
            --output-file .github/requirements/space-ci.lock \
            --upgrade-package 'uvicorn==0.53.0' \
            pyproject.toml space/requirements.lock
      - name: Reject unrequested graph changes and bind output hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil
          root = Path("lock-candidate")
          pattern = re.compile(r"(?m)^([A-Za-z0-9_.-]+)(?:\[[^\]]+\])?==([^\s\\]+)")
          def entries(path):
              text = Path(path).read_text(encoding="utf-8")
              matches = list(pattern.finditer(text))
              if not matches:
                  raise ValueError(f"no exact pins in {path}")
              result = {}
              for index, match in enumerate(matches):
                  end = matches[index + 1].start() if index + 1 < len(matches) else len(text)
                  name = re.sub(r"[-_.]+", "-", match.group(1)).lower()
                  hashes = sorted(set(re.findall(r"--hash=sha256:([0-9a-f]{64})", text[match.start():end])))
                  if name in result or not hashes:
                      raise ValueError(f"ambiguous or unhashed lock entry {name}")
                  result[name] = {"version": match.group(2), "hashes": hashes}
              return result
          production = entries("space/requirements.lock")
          test = entries(".github/requirements/space-ci.lock")
          for current, old in ((production, entries(root / "before/runtime.lock")), (test, entries(root / "before/test.lock"))):
              if set(current) != set(old):
                  raise SystemExit("dependency membership changed; separate review required")
              changed = {name for name in current if current[name]["version"] != old[name]["version"]}
              if changed - {"uvicorn"} or current["uvicorn"]["version"] != "0.53.0":
                  raise SystemExit(f"unexpected dependency version changes: {sorted(changed)}")
              for name in current:
                  if name != "uvicorn" and current[name] != old[name]:
                      raise SystemExit(f"unrelated distribution hashes changed for {name}; review required")
          for name, record in production.items():
              if test.get(name) != record:
                  raise SystemExit(f"production/test lock mismatch: {name}")
          shutil.copyfile("space/requirements.lock", root / "requirements.lock")
          shutil.copyfile(".github/requirements/space-ci.lock", root / "space-ci.lock")
          manifest = json.loads((root / "resolution.json").read_text(encoding="utf-8"))
          manifest.update(state="RESOLVED_CANDIDATE_ONLY", outputs_sha256={name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in ("requirements.lock", "space-ci.lock")}, versions={"runtime": {key: value["version"] for key, value in production.items()}, "test": {key: value["version"] for key, value in test.items()}}, runtime_pin_count=len(production), test_pin_count=len(test), repository_write_performed=False, source_tests_qualified=False, container_qualified=False, release_authorized=False)
          (root / "resolution.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"state": manifest["state"], "source_sha": manifest["source_sha"], "uvicorn": production["uvicorn"]["version"], "runtime_pin_count": len(production), "test_pin_count": len(test)}))
          PY
          git diff -- space/requirements.lock .github/requirements/space-ci.lock > lock-candidate/generated-locks.patch
      - name: Verify hash-required candidate installation without claiming source admission
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .candidate-venv
          .candidate-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --force-reinstall -r lock-candidate/space-ci.lock
          .candidate-venv/bin/python -m pip check
          .candidate-venv/bin/python -I - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import json
          assert version("uvicorn") == "0.53.0", "candidate install selected wrong Uvicorn"
          path = Path("lock-candidate/resolution.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["hashed_test_lock_install"] = "SUCCESS"
          manifest["state"] = "RESOLVED_AND_INSTALLABLE_CANDIDATE_ONLY"
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yarqa-lock-candidate-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: lock-candidate/
          if-no-files-found: error
          retention-days: 7
