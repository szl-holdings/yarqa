name: Apply YARQA source convergence contract

on:
  push:
    branches:
      - fix/hf-source-probe-convergence
    paths:
      - .github/workflows/apply-hf-source-convergence-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-source-probe-convergence
          fetch-depth: 0
      - name: Relock the deployment bytes and exact shared publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          digest_path = Path('tests/test_space_ci_dependency_contract.py')
          digest_text = digest_path.read_text(encoding='utf-8')
          old_digest = 'EXPECTED_HF_DEPLOY_SHA256 = "2d484f72ea6e33550a002d241e3384459eea4761205fb18c4bbf3d497e7980ca"'
          new_digest = 'EXPECTED_HF_DEPLOY_SHA256 = "5a9d82bb17f6aa7d09e0ef10dd965f13915099521879c05e791032f485222234"'
          if digest_text.count(old_digest) != 1:
              raise SystemExit(f'expected one old deploy digest, found {digest_text.count(old_digest)}')
          digest_path.write_text(digest_text.replace(old_digest, new_digest), encoding='utf-8', newline='\n')

          contract_path = Path('tests/test_hf_deploy_runtime_contract.py')
          contract_text = contract_path.read_text(encoding='utf-8')
          needle = '''        '- ".github/workflows/hf-deploy.yml"': "the workflow must trigger its own protected-main deployment",\n'''
          addition = needle + '''        "reusable-hf-deploy.yml@5a4c781502417fd0c4162514b2972a5852ae9fab": "deployment must use bounded post-restart source convergence",\n'''
          if contract_text.count(needle) != 1:
              raise SystemExit(f'expected one runtime-contract insertion seam, found {contract_text.count(needle)}')
          contract_path.write_text(contract_text.replace(needle, addition), encoding='utf-8', newline='\n')
          PY
      - name: Verify the byte lock and Python contract
        run: |
          python3 -m unittest -v tests.test_space_ci_dependency_contract
          python3 -m py_compile tests/test_hf_deploy_runtime_contract.py
          git diff --check
      - name: Commit the successor and remove this one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-hf-source-convergence-contract.yml
          git config user.name "SZL YARQA Source Convergence Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add tests/test_space_ci_dependency_contract.py tests/test_hf_deploy_runtime_contract.py .github/workflows/apply-hf-source-convergence-contract.yml
          git commit -s -m "test(hf): relock bounded source convergence"
          git push origin HEAD:fix/hf-source-probe-convergence
