#
# Mint a GENUINE Sigstore keyless DSSE signature over a yarqa provenance receipt
# and independently verify it (Fulcio ephemeral ECDSA-P256 cert + Rekor inclusion
# proof + DSSE signature), then reproduce the run from the authenticated replay
# recipe. This is live, third-party-checkable evidence that yarqa receipt signing
# is REAL -- not a placeholder.
#
# HONESTY: this upgrades the receipt SIGNATURE only. yarqa stays an
# engineering-method/CFD tier (receipts attest integrity + reproducibility, not
# correctness); the SLSA claim is unchanged (L1). Outside CI there is no ambient
# OIDC token, so every other runtime keeps the honest placeholder.
#
# Org policy permits only github-owned / verified actions, so Sigstore signing is
# driven by the hash-locked `sigstore` package + the repo's own scripts.
#
# Least privilege: `sign-and-verify` installs requirements/ci/receipt-sign.txt
# with --require-hashes and runs package code holding `id-token: write` and a
# read-only token. Only `publish-ledger` (pushes to main) holds
# `contents: write`; it installs nothing and appends the verified envelope to
# the governance-receipts branch with .github/scripts/publish_receipt_ledger.cjs.
# A failed ledger append fails the run (tests/test_receipt_ledger.py).

name: Receipt Sign (Sigstore keyless)

on:
  push:
    branches: [main, master]
    paths:
      - "yarqa/**"
      - "scripts/sign_receipt.py"
      - "scripts/verify_receipt.py"
      - "tests/test_signing.py"
      - "requirements/ci/receipt-sign.txt"
      - ".github/scripts/publish_receipt_ledger.cjs"
      - ".github/workflows/receipt-sign.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "yarqa/**"
      - "scripts/sign_receipt.py"
      - "scripts/verify_receipt.py"
      - "tests/test_signing.py"
      - "requirements/ci/receipt-sign.txt"
      - ".github/scripts/publish_receipt_ledger.cjs"
      - ".github/workflows/receipt-sign.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sign-and-verify:
    name: Sign + independently verify a yarqa receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # REQUIRED: the ambient OIDC token Fulcio exchanges for a cert
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked signing dependencies, then yarqa
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci/receipt-sign.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Offline self-test (no signature)
        run: python -m pytest -q tests/test_signing.py

      - name: Sign a yarqa receipt (real Sigstore keyless)
        run: python scripts/sign_receipt.py --nx 12 --ny 8 --seed 0

      - name: Locate signed envelope
        id: locate
        run: |
          envelope="$(ls attestations/yarqa/*.dsse.json | head -n1)"
          echo "envelope=${envelope}" >> "$GITHUB_OUTPUT"
          echo "Signed envelope: ${envelope}"

      - name: Independently verify (Fulcio + Rekor + DSSE) and reproduce the run
        env:
          ENVELOPE: ${{ steps.locate.outputs.envelope }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/receipt-sign.yml@${GITHUB_REF}"
          echo "Expected signer identity: ${identity}"
          python scripts/verify_receipt.py "${ENVELOPE}" \
            --identity "${identity}" \
            --issuer "https://token.actions.githubusercontent.com" \
            --replay

      - name: Upload signed receipt as evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yarqa-dsse-receipt
          path: attestations/yarqa/*.dsse.json
          if-no-files-found: error

  publish-ledger:
    name: Append the verified receipt to the governance-receipts ledger
    needs: sign-and-verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # append the signed receipt to the governance-receipts ledger branch
    steps:
      - name: Checkout the ledger publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified envelope
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yarqa-dsse-receipt
          path: ${{ runner.temp }}/yarqa-dsse-receipt

      - name: Publish signed receipt to ledger branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVELOPE_DIR: ${{ runner.temp }}/yarqa-dsse-receipt
        with:
          script: |
            const publish = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish_receipt_ledger.cjs`);
            await publish({ github, context, core, envelopeDir: process.env.ENVELOPE_DIR });
