# SPDX-License-Identifier: Apache-2.0
# One candidate-only object materialization, using independently checked resolver bytes.
# No commit, ref, default branch, publisher, model or runtime write is performed.
name: Materialize reviewed Yarqa lock and witness objects
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_reconcile_python_locks_once.yml
permissions:
  contents: read
concurrency:
  group: yarqa-reviewed-lock-objects-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  objects:
    if: github.repository == 'szl-holdings/yarqa' && github.event.pull_request.number == 65 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Materialize the verified dependency and version-witness objects
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          """Materialize verified locks and the exact matching Uvicorn witnesses; no ref writes."""
          from __future__ import annotations
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          REPO = "szl-holdings/yarqa"
          SOURCE = "e35cc233ab77b88b33336b4f3dd65087b5216c70"
          ARTIFACT_SHA256 = "ebc705c05d66918e19f6e3ba6eea4f859ce4f2499b4cd54ee66256ef178fb386"
          OLD = ("uvicorn[standard]==0.52.4 \\\n"
                 "    --hash=sha256:73acfee47a0b133c5de13d219492d62d8a31e935f4fe6e41a232451a15379f86 \\\n"
                 "    --hash=sha256:f86e41a149d7d05a9969337e3946a9c171c06a5d42680896daaba624aeac8da1")
          NEW = ("uvicorn[standard]==0.53.0 \\\n"
                 "    --hash=sha256:a9356f0cb89b3b8621529c5d5eebd69bfe154f4c3f68b4cf2de47e45fa855c2e \\\n"
                 "    --hash=sha256:e8dca71ec86dce5f04e333f0d56cdedf942446e6643b9cea1af0d6d3a02cb03e")
          SPECS = {
              "space/requirements.lock": {
                  "old_git": "6d90ee1184864a81370e63b1f9a1fcab6d478de8",
                  "old_sha256": "d752e4cad878af8a0aa02dae0832ef7b40a0f9b610a13aa35ac5ad18f65371e1",
                  "new_sha256": "31b749b7fa78035a20dc20b2988e964c9c9d1e5e6fce883ee87416f76f664672",
              },
              ".github/requirements/space-ci.lock": {
                  "old_git": "c56da7f9aa1776aa525bb00807678037a4431b9d",
                  "old_sha256": "1213f1cd52d77e1de151d35fd17fa5c94b701747e7d4bb14926b54e08e5786db",
                  "new_sha256": "98c358d31fc6e450cb8d045b8874906cea010e74b0e266d056847996e5a1811b",
              },
          }

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()

          def reviewed_candidate(data: bytes, spec: dict[str, str]) -> bytes:
              if len(data) > 100_000 or git_blob_sha(data) != spec["old_git"]:
                  raise ValueError("input Git blob mismatch")
              if hashlib.sha256(data).hexdigest() != spec["old_sha256"]:
                  raise ValueError("input SHA256 mismatch")
              text = data.decode("utf-8", errors="strict")
              if text.count(OLD) != 1:
                  raise ValueError("expected exact previous lock record once")
              result = text.replace(OLD, NEW, 1).encode("utf-8")
              if hashlib.sha256(result).hexdigest() != spec["new_sha256"]:
                  raise ValueError("candidate differs from verified resolver artifact")
              return result

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("unexpected GitHub API redirect")

          def main() -> None:
              token = os.environ["GH_TOKEN"]
              opener = urllib.request.build_opener(NoRedirect())
              def api(suffix: str, payload: dict | None = None) -> dict:
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{REPO}/{suffix}",
                      data=None if payload is None else json.dumps(payload).encode("utf-8"),
                      headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"},
                      method="GET" if payload is None else "POST",
                  )
                  with opener.open(request, timeout=30) as response:
                      data = response.read(2_000_001)
                  if len(data) > 2_000_000:
                      raise ValueError("oversized API response")
                  result = json.loads(data)
                  if not isinstance(result, dict):
                      raise ValueError("unexpected API response type")
                  return result
              pr = api("pulls/65")
              if pr.get("state") != "open" or pr.get("draft") is not True or pr["head"]["sha"] != os.environ["SOURCE_SHA"]:
                  raise ValueError("candidate moved or is no longer an open draft")
              output = {"schema": "szl.reviewed-lock-git-objects/v1", "resolver_source_sha": SOURCE, "resolver_artifact_id": 10727937220, "resolver_artifact_sha256": ARTIFACT_SHA256, "materializer_source_sha": os.environ["SOURCE_SHA"], "ref_updates": 0, "commit_creations": 0, "blobs": {}}
              prepared = {}
              for path, spec in SPECS.items():
                  blob = api(f"git/blobs/{spec['old_git']}")
                  if blob.get("sha") != spec["old_git"] or blob.get("encoding") != "base64":
                      raise ValueError("invalid source blob response")
                  data = base64.b64decode("".join(blob["content"].split()), validate=True)
                  if blob.get("size") != len(data):
                      raise ValueError("source blob size mismatch")
                  prepared[path] = reviewed_candidate(data, spec)
              # Source files below were read in full from this frozen main before review.
              def exact_text(sha: str) -> str:
                  blob = api(f"git/blobs/{sha}")
                  if blob.get("sha") != sha or blob.get("encoding") != "base64":
                      raise ValueError("invalid witness source response")
                  data = base64.b64decode("".join(blob["content"].split()), validate=True)
                  if len(data) > 100_000 or blob.get("size") != len(data) or git_blob_sha(data) != sha:
                      raise ValueError("witness source identity mismatch")
                  return data.decode("utf-8", errors="strict")
              original_workflow = exact_text("26e618b5887dbd2f3d84ad5f477dda70cfdb930e")
              original_tests = exact_text("ba86e045a3a8b35643400d787972a74eb2f55d3e")
              expected_old_workflow = "4c9c9175fc205a7013bc5475c75748455dbfa09b822265479947c0a1ee76a710"
              expected_old_run = "e6d111e0d857d976aee64f243ff11a79f78c36de94153aa8d30022380d4009ae"
              old_version = '"uvicorn": "0.52.4"'
              new_version = '"uvicorn": "0.53.0"'
              if original_workflow.count(old_version) != 2 or original_tests.count(old_version) != 1:
                  raise ValueError("version witness count changed")
              if hashlib.sha256(original_workflow.encode()).hexdigest() != expected_old_workflow:
                  raise ValueError("original workflow contract mismatch")
              def run_block(workflow: str) -> str:
                  marker = "      - name: Install, attest, and test the locked graph\n        run: |\n"
                  if workflow.count(marker) != 1:
                      raise ValueError("locked install step identity changed")
                  lines = workflow[workflow.index(marker) + len(marker):].splitlines(keepends=True)
                  body = []
                  for line in lines:
                      if line.startswith("      - name:") or (line and not line.startswith(" ") and line.strip()):
                          break
                      body.append(line)
                  return "".join(body).rstrip("\n") + "\n"
              if hashlib.sha256(run_block(original_workflow).encode()).hexdigest() != expected_old_run:
                  raise ValueError("original run contract mismatch")
              workflow = original_workflow.replace(old_version, new_version)
              new_workflow_sha = hashlib.sha256(workflow.encode()).hexdigest()
              new_run_sha = hashlib.sha256(run_block(workflow).encode()).hexdigest()
              tests = original_tests.replace(old_version, new_version)
              replacements = {
                  f'EXPECTED_RUN_SHA256 = "{expected_old_run}"': f'EXPECTED_RUN_SHA256 = "{new_run_sha}"',
                  f'EXPECTED_WORKFLOW_SHA256 = "{expected_old_workflow}"': f'EXPECTED_WORKFLOW_SHA256 = "{new_workflow_sha}"',
              }
              for old, new in replacements.items():
                  if tests.count(old) != 1:
                      raise ValueError("test contract constant missing or ambiguous")
                  tests = tests.replace(old, new, 1)
              restored = tests.replace(new_version, old_version)
              for old, new in replacements.items():
                  restored = restored.replace(new, old, 1)
              if restored != original_tests or workflow.replace(new_version, old_version) != original_workflow:
                  raise ValueError("witness change exceeds reviewed version-only scope")
              prepared[".github/workflows/space-ci.yml"] = workflow.encode("utf-8")
              prepared["tests/test_space_ci_dependency_contract.py"] = tests.encode("utf-8")
              output["witness_scope"] = {"workflow": "two Uvicorn expected-version values only", "tests": "one Uvicorn expected value and its exact workflow/run byte-contract hashes", "previous_workflow_sha256": expected_old_workflow, "previous_run_sha256": expected_old_run, "workflow_sha256": new_workflow_sha, "run_sha256": new_run_sha, "thresholds_changed": False, "scanners_changed": False, "hash_required_install_preserved": True}
              # These four immutable source objects are NOT commits or reference updates.
              for path, data in prepared.items():
                  result = api("git/blobs", {"encoding": "base64", "content": base64.b64encode(data).decode("ascii")})
                  expected_git = git_blob_sha(data)
                  if result.get("sha") != expected_git:
                      raise ValueError("written Git object differs from candidate")
                  output["blobs"][path] = {"git_sha": expected_git, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
              target = Path("reviewed-lock-objects.json")
              target.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(output, indent=2))

          if __name__ == "__main__":
              main()
          PY
      - name: Retain source and object binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-yarqa-lock-objects-${{ github.event.pull_request.head.sha }}
          path: reviewed-lock-objects.json
          if-no-files-found: error
          retention-days: 7
