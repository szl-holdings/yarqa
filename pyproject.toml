[build-system]
requires = [
    "setuptools==84.2.1",
    "wheel==0.48.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "yarqa"
version = "0.5.0"
description = "Plug-flow compartmentalization for compartmental models (clean-room, Apache-2.0)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SZL Holdings" }]
keywords = [
    "cfd",
    "compartment-model",
    "plug-flow",
    "reactor-engineering",
    "provenance",
    "receipts",
    "sigstore",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pip==26.2.2",
    "pytest==9.2.0",
    "setuptools==84.2.1",
    "wheel==0.48.0",
]

[project.urls]
Homepage = "https://github.com/szl-holdings/yarqa"
Source = "https://github.com/szl-holdings/yarqa"
Issues = "https://github.com/szl-holdings/yarqa/issues"
Changelog = "https://github.com/szl-holdings/yarqa/releases"

[tool.setuptools.packages.find]
include = ["yarqa*"]

[tool.szl.release]
import_names = ["yarqa"] # wheel top-level import names; the release gate fails if the built wheel differs
