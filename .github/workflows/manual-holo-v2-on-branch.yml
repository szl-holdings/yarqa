name: Install Yarqa Holo-Constellation v2 on Branch

on:
  push:
    branches:
      - design/holographic-space-v2-manual
    paths:
      - ".github/workflows/manual-holo-v2-on-branch.yml"

permissions:
  contents: write

concurrency:
  group: yarqa-holo-v2-manual
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact adapter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/holographic-space-v2-manual
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch immutable first-party Holo assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "https://raw.githubusercontent.com/szl-holdings/a11oy/a8494fc4d40d0918d33d72e64739eedbd4c33803/console/assets"
          target = Path("space/static")
          for name in ("szl-holo-v2.css", "szl-holo-v2.js"):
              request = Request(f"{base}/{name}", headers={"User-Agent": "szl-yarqa-holo-adapter/2"})
              with urlopen(request, timeout=30) as response:
                  payload = response.read()
              if len(payload) < 1000:
                  raise SystemExit(f"canonical asset unexpectedly small: {name}")
              (target / name).write_bytes(payload)
          PY

      - name: Bind Yarqa's native static application
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("space/static/index.html")
          text = path.read_text(encoding="utf-8")
          style = '<link rel="stylesheet" href="/szl-holo-v2.css" data-szl-holo-asset="style-v2" />'
          script = '<script src="/szl-holo-v2.js" defer data-szl-holo-asset="script-v2"></script>'
          if style not in text:
              marker = text.lower().rfind("</head>")
              if marker < 0:
                  raise SystemExit("Yarqa index is missing </head>")
              text = text[:marker] + "  " + style + "\n" + text[marker:]
          if script not in text:
              marker = text.lower().rfind("</body>")
              if marker < 0:
                  raise SystemExit("Yarqa index is missing </body>")
              text = text[:marker] + "  " + script + "\n" + text[marker:]
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Prove source-native binding and CSP compatibility
        run: |
          python3 -m py_compile space/app.py space/feeds.py
          python3 - <<'PY'
          from pathlib import Path
          html = Path("space/static/index.html").read_text(encoding="utf-8")
          app = Path("space/app.py").read_text(encoding="utf-8")
          assert html.count('data-szl-holo-asset="style-v2"') == 1
          assert html.count('data-szl-holo-asset="script-v2"') == 1
          assert 'app.mount("/", StaticFiles' in app
          assert "script-src 'self'" in app
          assert "style-src 'self'" in app
          assert Path("space/static/szl-holo-v2.css").stat().st_size > 1000
          assert Path("space/static/szl-holo-v2.js").stat().st_size > 1000
          PY
          git diff --check

      - name: Commit adapter and remove one-shot controller
        run: |
          set -euo pipefail
          rm .github/workflows/manual-holo-v2-on-branch.yml
          git config user.name "SZL Yarqa Holo Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add space/static/index.html space/static/szl-holo-v2.css space/static/szl-holo-v2.js .github/workflows/manual-holo-v2-on-branch.yml
          git commit -s -m "feat(frontend): install Yarqa Holo-Constellation v2"
          git push origin HEAD:design/holographic-space-v2-manual
